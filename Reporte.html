<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>reporte</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    #imagenLugar {
      width: 100%;
      max-width: 400px;
      height: 250px;
      border: 2px solid #ccc;
      margin-bottom: 20px;
      object-fit: cover;
    }
    form {
      max-width: 400px;
    }
    select, textarea, button {
      width: 100%;
      margin: 8px 0;
      padding: 8px;
    }
    button {
      background-color: #2c7be5;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #1a5bb8;
    }
  </style>
</head>
<body>
  <h1>Reporta tus problemas</h1>

  <img id="imagenLugar" src="" alt="Selecciona un lugar"/>
  
  <form id="reportForm">
    <label>Selecciona el lugar:</label>
    <select id="lugar" required>
      <option value="">-- Elige un lugar --</option>
      <option value="Lugar1">Baños</option>
      <option value="Lugar2">Salones700</option>
      </select>

    <label>Descripción del problema:</label>
    <textarea id="descripcion" required></textarea>

    <button type="submit">Enviar reporte</button>
  </form>


  <script>
    const imagenLugar = document.getElementById("imagenLugar");
    const lugarSelect = document.getElementById("lugar");

    const imagenes = {
  "Lugar1": "./Imágenes/Lugar1.png",
  "Lugar2": "./Imágenes/Lugar2.png"
};
    lugarSelect.addEventListener("change", function(){
      const lugar = lugarSelect.value;
      if(imagenes[lugar]){
        imagenLugar.src = imagenes[lugar];
      } else {
        imagenLugar.src = "";
        imagenLugar.alt = "No hay imagen para este lugar";
      }
    });

    
  </script>
    <script>
  const form = document.getElementById("reportForm");
  form.addEventListener("submit", function(e){
    e.preventDefault(); 
    window.location.href = "After_reporte.html"; 
  });
    </script>
</body>
</html>
